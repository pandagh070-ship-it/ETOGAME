<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETOGAME | Game Library</title><meta name="theme-color" content="#0b0d12">
<link rel="stylesheet" href="styles.css?v=3">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="noise"></div>
<header class="top"><a class="logo" href="#">ETO<span>GAME</span></a><nav><a href="#discover">اكتشف</a><a href="#updates">التحديثات</a></nav><div class="top-actions"><button id="theme" class="icon">◐</button><button id="account" class="account">دخول</button></div></header>
<main>
<section class="landing">
<div class="landing-copy"><div class="eyebrow">DIGITAL GAME LIBRARY</div><h1>العابك<br><span>تبدأ هنا.</span></h1><p>منصة ETOGAME الجديدة لاكتشاف الألعاب وإدارة الإصدارات والتحميلات من مكان واحد.</p><div class="landing-buttons"><a href="#discover" class="cta">استكشف المكتبة <b>↓</b></a><button id="loginHero" class="ghost">حسابي</button></div></div>
<div class="orbit"><div class="orbit-ring r1"></div><div class="orbit-ring r2"></div><div class="core">ETO<br><small>GAME</small></div><div class="tag t1">APK</div><div class="tag t2">EXE</div><div class="tag t3">ONLINE</div></div>
</section>
<section id="discover" class="library">
<div class="library-head"><div><span class="eyebrow">LIBRARY</span><h2>اختار لعبتك</h2></div><div class="controls"><label>⌕ <input id="search" placeholder="بحث"></label><select id="filter"><option value="">الكل</option></select></div></div>
<div id="status" class="status">جاري تجهيز المكتبة...</div><div id="games" class="games"></div>
</section>
<section id="updates" class="updates"><div class="section-title"><span class="eyebrow">CHANGELOG</span><h2>آخر الأخبار</h2></div><div id="news" class="news"></div></section>
</main>
<footer><b>ETOGAME</b><span>مكتبة ألعاب مستقلة</span><span>© 2026</span></footer>
<dialog id="gameModal"><div id="gameModalBody"></div><button class="modal-x" data-close>×</button></dialog>
<dialog id="authModal"><div id="authBody"></div><button class="modal-x" data-close>×</button></dialog>
<div id="toast"></div>
<script src="app.js?v=3"></script>
</body></html>
