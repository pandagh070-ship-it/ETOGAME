name: Build Eto Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "EtoDesktop/**"
      - ".github/workflows/build-etodesktop.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild EtoDesktop\EtoDesktop.csproj /p:Configuration=Release /p:Platform=AnyCPU
      - name: Package
        shell: powershell
        run: Compress-Archive -Path EtoDesktop\bin\Release\* -DestinationPath EtoDesktop.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EtoDesktop
          path: EtoDesktop.zip